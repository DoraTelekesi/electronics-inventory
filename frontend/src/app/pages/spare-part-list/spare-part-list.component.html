<div class="content h-full w-full flex flex-col items-center bg-[#09090B]">
  <header class="w-full h-20 flex justify-between items-center p-5 m-0">
    <p *ngIf="user$ | async as user" class="text-neutral-400">
      {{ user.username }}
    </p>
    <button
      class="p-2 text-neutral-400 border border-solid rounded-sm"
      (click)="onLogout()"
    >
      Logout
    </button>
  </header>
  <div class="main w-full h-full flex flex-col justify-center rounded-lg">
    <div class="title-section flex justify-between m-10">
      <div class="flex items-center gap-20">
        <h1 class="text-5xl text-[rgb(247,64,9)]">Spare Parts</h1>
        <div class="filter-section flex gap-5">
          <img
            src="assets/icon/filter.png"
            class="w-9 invert"
            alt="filter icon"
          />
          <img
            src="assets/icon/down-arrow.png"
            class="w-9 invert cursor-pointer"
            alt="arrow down"
            (click)="toggleFilterPanel()"
          />
        </div>
      </div>

      <button
        [routerLink]="['/add-item']"
        class="text-neutral-900 p-2 rounded-sm border bg-[rgb(245,73,0)] border-[oklch(64.6% 0.222 41.116)]"
      >
        + ADD ITEM
      </button>
    </div>
    <div *ngIf="filterOpened" class="filter-section">
      <app-filter-spare-part
        (searchedItem)="receiveFromFilter($event)"
        (clearedFilter)="clearFilter()"
      ></app-filter-spare-part>
    </div>
    <div class="table-section h-full w-full mb-20 mt-10">
      <table class="table border-2 border-solid border-[rgb(73,22,0)] w-full">
        <thead class="bg-[rgb(9,9,11)]">
          <th class="text-[rgb(247,64,9)]">MANUFACTURER</th>
          <th class="text-[rgb(247,64,9)]">MODEL</th>
          <th class="text-[rgb(247,64,9)]">TYPE</th>
          <th class="text-[rgb(247,64,9)]">DEPOT</th>
          <th class="text-[rgb(247,64,9)]">AMOUNT</th>
          <th class="text-[rgb(247,64,9)]">REMARKS</th>
          <th class="text-[rgb(247,64,9)]">ACTION</th>
        </thead>

        <tbody>
          <tr
            *ngFor="let sparePart of sparePartList$ | async; let i = index"
            class="px-2"
          >
            <th class="text-[rgb(255,214,168)]">
              {{ sparePart.manufacturer }}
            </th>
            <td class="text-[rgb(206,147,84)]">{{ sparePart.model }}</td>
            <td class="text-[rgb(255,214,168)]">{{ sparePart.type }}</td>
            <td class="text-[rgb(255,214,168)]">{{ sparePart.depot }}</td>
            <td class="text-[rgb(255,214,168)]">{{ sparePart.amount }}</td>
            <td class="text-[rgb(255,214,168)]">{{ sparePart.remarks }}</td>
            <td class="flex justify-evenly">
              <button
                [routerLink]="['/spare-part-list', sparePart._id]"
                class="p-2 bg-teal-600 rounded-md"
              >
                Edit
              </button>
              <button
                (click)="onDelete(sparePart._id)"
                class="p-2 bg-red-600 rounded-md"
              >
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
