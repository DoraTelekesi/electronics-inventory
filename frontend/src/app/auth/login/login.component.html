<div
  class="content-wrap bg-neutral-950 h-full w-full flex justify-center items-center"
>
  <canvas #canvasBox class="canvas"></canvas>


  <div
    class="z-10 bg-gradient-to-b flex flex-col justify-center items-center rounded-lg"
  >


    <h1 class="text-5xl text-neutral-400 mb-20">Login</h1>
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-4 items-center justify-center"
    >
      <label class="text-neutral-400" for="email">E-mail</label>
      <input type="email" id="email" name="email" formControlName="email" />
      <label class="text-neutral-400" for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        formControlName="password"
      />
      <button
        class="text-neutral-400 p-2 rounded-sm border-solid border-[rgb(206,235,53)] border-2"
        type="submit"
      >
        Login
      </button>
    </form>
    <button
      [routerLink]="['/register']"
      class="text-neutral-400 p-2 rounded-sm border-solid border-[rgb(206,235,53)] border-2"
    >
      Signup
    </button>
  </div>
</div>
