<div class="content-wrap bg-zinc-900 h-full w-full flex items-start gap-10">
  <canvas #canvasBox class="canvas"></canvas>

  <div
    class="z-10 bg-gradient-to-b flex h-full w-full justify-around rounded-lg p-10"
  >
    <h1
      class="tracking-wide text-7xl text-[rgb(254,254,254)] drop-shadow-[6px_6px_2px_rgb(142,24,24)]"
    >
      Sign up
    </h1>
    <form
      [formGroup]="registerForm"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-4"
    >
      <label class="text-[rgb(248,249,244)]" for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        formControlName="username"
      />
      <label class="text-[rgb(248,249,244)]" for="email">E-mail</label>
      <input type="email" id="email" name="email" formControlName="email" />
      <label class="text-[rgb(248,249,244)]" for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        formControlName="password"
      />
      <button
        class="text-[rgb(248,249,244)] p-2 rounded-sm border-solid border-[rgb(206,235,53)] border-2 bg-[rgb(56,60,43)] hover:bg-[rgb(235,142,48)] hover:border-[rgb(235,205,104)] hover:drop-shadow-[5px_5px_2px_rgb(153,87,42)]"
        type="submit"
      >
        Sign up
      </button>
    </form>
  </div>
</div>
